name: Pubblica documento LaTeX

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Installa LaTeX e gli strumenti HTML
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full latexml

      - name: Converti in HTML
        run: |
          cp "Polito PhD thesis template.tex" web-thesis.tex
          make4ht -u -f html5 -d site web-thesis.tex "mathjax"
          test -s site/web-thesis.html
          cp site/web-thesis.html site/index.html

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
